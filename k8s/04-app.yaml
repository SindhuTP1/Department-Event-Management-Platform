apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-app
  namespace: events
  labels: {app: event-app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: event-app}
  template:
    metadata:
      labels: {app: event-app}
    spec:
      containers:
        - name: event-app
          image: event-app:1.0
          imagePullPolicy: Never      # image is loaded into minikube with `minikube image load`
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: event-config
            - secretRef:
                name: db-credentials
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: event-app
  namespace: events
spec:
  type: NodePort
  selector: {app: event-app}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
