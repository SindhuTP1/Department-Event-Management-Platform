# Demo credentials only. For real use, create the secret out-of-band:
#   kubectl -n events create secret generic db-credentials \
#     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=... --from-literal=POSTGRES_DB=...
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: events
type: Opaque
stringData:
  POSTGRES_DB: eventsdb
  POSTGRES_USER: eventuser
  POSTGRES_PASSWORD: eventpass
